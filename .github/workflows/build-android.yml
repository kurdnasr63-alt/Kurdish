
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: unzip -q konkan_kurdish_flutter_mvp.zip -d .

      - name: Install dependencies
        working-directory: konkan_kurdish
        run: flutter pub get

      - name: Build APK
        working-directory: konkan_kurdish
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kurdish-Kongkan-APK
          path: konkan_kurdish/build/app/outputs/flutter-apk/app-release.apk
