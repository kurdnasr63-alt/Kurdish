
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: unzip -q konkan_kurdish_flutter_mvp.zip -d .

      - name: Get dependencies
        working-directory: konkan_kurdish
        run: flutter pub get



      - uses: actions/upload-artifact@v4
        with:
          name: Kurdish-Kongkan-APK
          path: konkan_kurdish/build/app/outputs/flutter-apk/app-release.apk
